#s{background:#b8542a;margin-top:8px}

.row button{font-size:13px;padding:12px 4px}
#h{background:#2f8f55;margin-top:8px}
button:disabled{opacity:.4}
#m{background:transparent;color:var(--fg);border:2px solid var(--line);font-size:14px;padding:8px;margin-top:8px}
p{max-width:640px;font-size:14px;opacity:.75;text-align:center;margin:10px 0 0}
